<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Add Food - Kinetiq</title>
</head>

<body>

        <h2>Add Food</h2>

        <form method="POST">

            <div class="food-search">

                <label for="food-search">Search for a food</label>
                <input
                    type="text"
                    id="food-search"
                    placeholder="Start typing..."
                    autocomplete="off"
                >

                <input
                    type="hidden"
                    id="food_id"
                    name="food_id"
                >

                <div id="search-results"></div>

            </div>

                <br><br>

                <label for="quantity">Amount (g):</label>
                <input type="number"
                    id="quantity"
                    name="quantity"
                    min="0.1"
                    step="0.1"
                    required
                >

                <br><br>

                <button type="submit">Add Food</button>

        </form>

</body>

</html>

<script>
const searchInput = document.getElementById("food-search");
const resultsContainer = document.getElementById("search-results");

let searchTimeout;

searchInput.addEventListener("input", function () {
    const query = searchInput.value.trim();

    clearTimeout(searchTimeout)

    if (query.length < 3) {
        resultsContainer.innerHTML = "";
        return;
    }

    searchTimeout = setTimeout(async function () {
        const response = await fetch(
            `/api/foods/search?q=${encodeURIComponent(query)}`
        );

        const data = await response.json();

        resultsContainer.innerHTML = "";

        for (const food of data.foods) {
            const result = document.createElement("div");

            result.className = "food-result";
            result.textContent = food.description;

            result.addEventListener("click", function () {
                searchInput.value = food.description;
                document.getElementById("food_id").value = food.fdc_id;
                resultsContainer.innerHTML = "";
            });

            resultsContainer.appendChild(result);
        }
    }, 300)
});
</script>
