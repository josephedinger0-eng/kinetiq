<!DOCTYPE html>
<html>

<head>
    <title>Edit Food</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>Kinetiq</h1>
</header>

<main>

    <h2>Edit Food Entry</h2>

    <form method="POST">

        <label for="quantity">Quantity (g)</label>

        <input
            type="number"
            id="quantity"
            name="quantity"
            step="0.1"
            min="0.1"
            required
        >

        <button class="button" type="submit">
            Save Changes
        </button>
        
    </form>

</main>

</body>
</html>
